<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TKO 스폰서십 시계열</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --bg: #FFFFFF;
    --border: #E8E7E0;
    --text-1: #1F1F1D;
    --text-2: #5F5E5A;
    --text-3: #888780;
    --accent: #185FA5;
    --accent-soft: #5A95D4;
    --neutral: #7A7973;
    --grid: rgba(80,80,75,0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #2A2A28;
      --border: #3A3A37;
      --text-1: #ECEAE2;
      --text-2: #BFBDB4;
      --text-3: #8A8881;
      --accent: #5A95D4;
      --accent-soft: #185FA5;
      --neutral: #888780;
      --grid: rgba(180,180,170,0.12);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    background: transparent;
    color: var(--text-1);
    padding: 14px;
    font-size: 13px;
    line-height: 1.5;
  }
  .card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 20px;
  }
  h1 { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: var(--text-1); }
  .legend {
    display: flex;
    gap: 16px;
    margin-bottom: 10px;
    font-size: 11.5px;
    color: var(--text-2);
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; }
  .chart-wrap { position: relative; width: 100%; height: 380px; }
  .note {
    margin-top: 12px;
    font-size: 11px;
    color: var(--text-3);
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="card">
  <h1>TKO 스폰서십 매출 추이 ($M)</h1>

  <div class="legend">
    <div class="legend-item"><span class="swatch" style="background: #185FA5;"></span><span>UFC</span></div>
    <div class="legend-item"><span class="swatch" style="background: #C77B3C;"></span><span>WWE</span></div>
  </div>

  <div class="chart-wrap"><canvas id="chart"></canvas></div>

  <div class="note">UFC 4년간 +90% 성장 ($132M → $251M). WWE는 합병 후 1년 만에 +99% ($83M → $165M E). WWE가 UFC 벤치마크($251M)까지 정상화 시 +$86M 추가 upside. 출처: TKO 10-K, 10-Q.</div>
</div>

<script>
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
const C = {
  ufc: '#185FA5',
  ufcLight: dark ? '#5A95D4' : '#185FA5',
  wwe: '#C77B3C',
  wweLight: dark ? '#E2A06A' : '#C77B3C',
  text: dark ? '#BFBDB4' : '#4A4A46',
  grid: dark ? 'rgba(180,180,170,0.12)' : 'rgba(80,80,75,0.10)',
  axisText: dark ? '#8A8881' : '#5F5E5A'
};

new Chart(document.getElementById('chart'), {
  type: 'line',
  data: {
    labels: ['2021', '2022', '2023', '2024', '2025E'],
    datasets: [
      {
        label: 'UFC',
        data: [132, 167, 196, 251, 290],
        borderColor: C.ufcLight,
        backgroundColor: C.ufcLight,
        tension: 0.25,
        pointRadius: 5,
        pointHoverRadius: 7,
        borderWidth: 2.5
      },
      {
        label: 'WWE',
        data: [null, null, null, 83, 165],
        borderColor: C.wweLight,
        backgroundColor: C.wweLight,
        tension: 0.25,
        pointRadius: 5,
        pointHoverRadius: 7,
        borderWidth: 2.5,
        borderDash: [4, 3]
      }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    layout: { padding: { right: 20, left: 8, top: 20, bottom: 4 } },
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: dark ? '#1F1F1D' : '#FFFFFF',
        titleColor: C.text,
        bodyColor: C.text,
        borderColor: C.grid,
        borderWidth: 1,
        padding: 8,
        callbacks: { label: (c) => ` ${c.dataset.label}: $${c.parsed.y}M` }
      }
    },
    scales: {
      x: {
        ticks: { color: C.axisText, font: { size: 11 } },
        grid: { display: false },
        border: { color: C.grid }
      },
      y: {
        min: 0, max: 330,
        ticks: { callback: (v) => '$' + v + 'M', color: C.axisText, font: { size: 10 } },
        grid: { color: C.grid, drawTicks: false },
        border: { display: false }
      }
    }
  },
  plugins: [{
    id: 'pointLabels',
    afterDatasetsDraw(chart) {
      const { ctx } = chart;
      ctx.save();
      ctx.font = '500 10px -apple-system, sans-serif';
      ctx.textBaseline = 'bottom';
      ctx.textAlign = 'center';
      chart.data.datasets.forEach((ds, dsIdx) => {
        chart.getDatasetMeta(dsIdx).data.forEach((point, i) => {
          const v = ds.data[i];
          if (v === null) return;
          ctx.fillStyle = dsIdx === 0 ? C.ufcLight : C.wweLight;
          ctx.fillText('$' + v + 'M', point.x, point.y - 8);
        });
      });
      ctx.restore();
    }
  }]
});
</script>
</body>
</html>
